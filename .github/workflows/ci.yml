name: Build and package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Build bundled audio player
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          docker build --tag decky-audiobookshelf-player ./backend
          docker run --rm --user 0:0 \
            --volume "$PWD/backend:/backend" \
            decky-audiobookshelf-player
          install -m 0755 ./backend/out/mpv ./bin/mpv
      - name: Inspect bundled player dependencies
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          file ./bin/mpv
          docker run --rm --platform linux/amd64 \
            --entrypoint /bin/bash \
            --volume "$PWD/bin:/output:ro" \
            decky-audiobookshelf-player \
            -lc 'ldd /output/mpv && /output/mpv --version'
      - run: pnpm run package:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: decky-audiobookshelf
          path: out/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip --generate-notes
