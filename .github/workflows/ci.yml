name: Build and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Install bundled-player build dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential git libasound2-dev \
            libfontconfig1-dev libfreetype6-dev libfribidi-dev \
            libgnutls28-dev libharfbuzz-dev libpulse-dev libtool \
            nasm ninja-build pkg-config \
            python3-jinja2 python3-pip yasm
          python3 -m pip install --user "meson>=1.3,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build bundled audio player
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/build_mpv.sh ./bin/mpv
      - name: Inspect bundled player dependencies
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          file ./bin/mpv
          ldd ./bin/mpv
          ./bin/mpv --version
      - run: pnpm run package:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: decky-audiobookshelf
          path: out/*.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip --generate-notes
